# Project-wide Gradle settings.
# See https://developer.android.com/build/optimize-your-build

# Memory and parallel builds — tuned for CI
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.configuration-cache=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
kotlin.incremental=true

# Compose compiler is configured by the Kotlin Compose plugin (Kotlin 2.0+)
# No need to set kotlinCompilerExtensionVersion manually.
