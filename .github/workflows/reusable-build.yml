name: Reusable build

on:
  workflow_call:
    inputs:
      variant:
        required: true
        type: string
      artifact-prefix:
        required: false
        type: string
        default: ''
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ inputs.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode keystore
        if: ${{ inputs.variant == 'release' && secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          mkdir -p app
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > app/keystore.jks
          cat > keystore.properties <<EOF
          storeFile=keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build ${{ inputs.variant }}
        run: ./gradlew assemble${{ inputs.variant }} bundle${{ inputs.variant }} --stacktrace --no-daemon

      - name: Locate APK/AAB outputs
        id: collect
        run: |
          mkdir -p artifacts
          for f in app/build/outputs/apk/${{ inputs.variant }}/**/*.apk \
                   app/build/outputs/apk/${{ inputs.variant }}/*.apk \
                   app/build/outputs/bundle/${{ inputs.variant }}/*.aab; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            prefix="${{ inputs.artifact-prefix }}"
            if [ -n "$prefix" ]; then
              cp "$f" "artifacts/${prefix}-${base}"
            else
              cp "$f" "artifacts/${base}"
            fi
          done
          ls -la artifacts/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.variant }}-build-${{ github.run_id }}
          path: artifacts/
          retention-days: 30
